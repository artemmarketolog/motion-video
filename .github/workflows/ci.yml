name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: compile every script and template
        run: python -m py_compile scripts/*.py scripts/footage/*.py assets/templates/*/build.py setup.py
      - name: JSON assets parse
        run: python -c "import json,glob; [json.load(open(f)) for f in glob.glob('assets/**/*.json', recursive=True)]"
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
